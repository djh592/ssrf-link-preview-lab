<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An instrumented testbed for attacks and defenses in link preview services"
    />
    <title>SSRF Link Preview Lab</title>
    <script>
      (() => {
        const availableThemes = ["system", "light", "dark"];
        const queryTheme = new URLSearchParams(window.location.search).get("theme");
        let storedTheme = null;
        try {
          storedTheme = window.localStorage.getItem("ssrf-link-preview-theme");
        } catch {
          // The deck remains usable when browser storage is unavailable.
        }

        const theme = availableThemes.includes(queryTheme)
          ? queryTheme
          : availableThemes.includes(storedTheme)
            ? storedTheme
            : "system";
        const prefersDark = window.matchMedia?.(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.resolvedTheme =
          theme === "system" ? (prefersDark ? "dark" : "light") : theme;
      })();
    </script>
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link
      rel="stylesheet"
      href="node_modules/reveal.js/dist/theme/white.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="deck-toolbar">
      <button
        class="print-toggle"
        type="button"
        aria-label="Open print-ready presentation"
        title="Open print-ready presentation"
      >
        <svg class="print-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9V2h12v7" />
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
          <rect x="6" y="14" width="12" height="8" />
        </svg>
      </button>
      <button
        class="theme-toggle"
        type="button"
        aria-label="Change slide theme"
        title="Cycle system, light, and dark themes"
      >
        <svg
          class="theme-toggle-icon icon-system"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="14" rx="2" />
          <path d="M8 21h8M12 18v3" />
        </svg>
        <svg
          class="theme-toggle-icon icon-light"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg
          class="theme-toggle-icon icon-dark"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M20.8 15.2A8.5 8.5 0 0 1 8.8 3.2a8.5 8.5 0 1 0 12 12Z" />
        </svg>
      </button>
    </div>

    <div class="reveal">
      <div class="slides" aria-busy="true"></div>
    </div>
    <p id="deck-error" class="deck-error" role="alert" hidden></p>

    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script src="node_modules/reveal.js/dist/plugin/notes.js"></script>
    <script src="deck.js"></script>
  </body>
</html>
